<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="java_script/app.js" defer></script>
</head>

<body>

    <div class="container">
        <section class="send">
            <div class="intro">
                <h1>File Share</h1>
                <p>Transfer files between your devices in seconds.</p>
            </div>
            <h3>Send a File</h3>
            <p>Choose any supported file from your device.</p>
            <input id="sendButton" class="file-input" type="file" accept="*/*">
            <label for="sendButton" class="file-box">
                <span><strong>Choose a file</strong><small>Click to browse from your device</small></span>
            </label>
        </section>
        <section class="receive">
            <h3>Receive File via Code</h3>
            <p>Enter the code provided by the sender.</p>
            <input type="text" id="codeInput" placeholder="Enter code">
        </section>
    </div>

</body>

</html>
